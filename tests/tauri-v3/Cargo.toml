[package]
name = "tauri-specta-v3-tests"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.95"

# A separate resolver graph: the main workspace's applications select Tauri v2,
# and Cargo permits only one package with links = "Tauri" in each lockfile.
[workspace]

[dev-dependencies]
tauri = { version = "=3.0.0-alpha.6", default-features = false, features = ["test"] }
# Disabling default features drops the v2 pin, and `v3` declares the intent.
tauri-specta = { path = "../..", default-features = false, features = ["derive", "typescript", "javascript", "v3"] }
tauri-specta-query = { path = "../../crates/tauri-specta-query", default-features = false, features = ["v3"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
