name: Dependabot Auto-Merge

# Enables GitHub's native auto-merge on Dependabot PRs. The merge only happens
# once the required status checks (see the branch protection rules on `main`)
# have passed, so a breaking dependency bump simply stays open for a human.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --merge
