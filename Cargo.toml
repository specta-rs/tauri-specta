[package]
name = "tauri-specta"
description = "Completely typesafe Tauri commands"
version = "2.0.0-rc.29"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE"]
repository = "https://github.com/specta-rs/tauri-specta"
documentation = "https://docs.rs/tauri-specta/latest/tauri-specta"
keywords = ["async", "specta", "rspc", "typescript", "typesafe"]
categories = ["web-programming", "asynchronous"]

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features --no-deps
# `--no-deps` matters: RUSTDOCFLAGS applies to every crate rustdoc builds, and some
# dependencies still gate removed nightly features behind `cfg(docsrs)`.
[package.metadata."docs.rs"]
# Not `all-features`: `introspection` needs a Tauri build with
# tauri-apps/tauri#15326, which docs.rs cannot get from crates.io yet.
features = ["derive", "javascript", "typescript"]

[features]
# Tauri v2 is the default: this pins `tauri` to 2.x so an unconstrained consumer
# does not resolve the v3 prerelease that the dependency range also admits. Disable
# default features and depend on Tauri v3 yourself to use v3.
default = ["v2"]
v2 = ["dep:tauri-specta-pin"]
# Read command types from Tauri's IPC introspection, so commands do not need
# `#[specta::specta]`. Requires a Tauri build with tauri-apps/tauri#15326 (merged,
# unreleased); it becomes part of the default set once Tauri ships it.
introspection = ["dep:tauri-specta-macros"]
derive = ["dep:tauri-specta-macros"]
javascript = ["dep:specta-typescript"]
typescript = ["dep:specta-typescript"]

[lints]
workspace = true

[dependencies]
# Public
specta = { workspace = true, features = ["function"] }
specta-typescript = { workspace = true, optional = true }
tauri-specta-macros = { version = "=2.0.0-rc.29", optional = true, path = "./macros" }
tauri-specta-pin = { version = "0.1.0", optional = true, path = "./crates/tauri-specta-pin" }
serde = "1"
serde_json = "1"
thiserror = "2"
tauri = { workspace = true, features = ["specta"] }

# Private
heck = "0.5"
paste = "1"
specta-serde = { workspace = true }
specta-util = { workspace = true }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test", "wry"] }

[workspace]
exclude = ["tests/tauri-default", "tests/tauri-v3"]
members = [
  "crates/tauri-specta-query",
  "crates/tauri-specta-pin",
  "examples/app/src-tauri",
  "examples/tanstack-query/src-tauri",
  "examples/custom-plugin/app/src-tauri",
  "examples/custom-plugin/plugin",
  "macros",
]

[workspace.lints.rust]
unsafe_code = { level = "forbid", priority = -1 }
missing_docs = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }
unwrap_used = { level = "warn", priority = -1 }
panic = { level = "warn", priority = -1 }
todo = { level = "warn", priority = -1 }
panic_in_result_fn = { level = "warn", priority = -1 }

[workspace.dependencies]
# Bound v3 prereleases to the latest tested alpha. Applications select their Tauri major.
tauri = { version = ">=2, <=3.0.0-alpha.6", default-features = false }
tauri-build = { version = "2" }
tauri-plugin = { version = "2" }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = { version = "0.0.15" }
specta-serde = { version = "0.0.15" }
specta-util = { version = "0.0.15" }

[patch.crates-io]
# Tauri's primary branch is `dev`. Pinned to the commit that contains #16374
# (`ipc::Request`/`Response` Specta impls) and #15326 (command introspection), both
# of which are unreleased. Tauri Specta cannot be released until Tauri ships them in
# a minor; swap these for the published version then.
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "61a3537e040f1f5feb59a3892f061cef545da2c8" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "61a3537e040f1f5feb59a3892f061cef545da2c8" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "61a3537e040f1f5feb59a3892f061cef545da2c8" }
