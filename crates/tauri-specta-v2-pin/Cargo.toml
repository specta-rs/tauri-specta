[package]
name = "tauri-specta-v2-pin"
description = "Pins Tauri Specta's Tauri dependency to v2 for unconstrained consumers"
# Versioned in lockstep with `tauri-specta`, `tauri-specta-macros` and
# `tauri-specta-query`; the `release` workflow requires all four to match the `v*` tag.
version = "2.0.0-rc.29"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/specta-rs/tauri-specta"
documentation = "https://docs.rs/tauri-specta-v2-pin/latest/tauri_specta_v2_pin"
keywords = ["tauri", "specta", "version"]
categories = ["development-tools"]

[dependencies]
# `tauri-specta` depends on `tauri` over a range that also admits v3 prereleases,
# and Cargo selects the highest match. Enabling this crate adds a real `tauri = "2"`
# edge to the graph, so an application that has not selected a Tauri version itself
# resolves stable v2 instead of a v3 alpha.
#
# Cargo rejects two names for the *same* package inside one manifest, so this edge
# cannot live in `tauri-specta` itself. A third crate can hold it: it participates
# in normal dependency resolution, so it constrains the one `tauri` package.
tauri = { version = "2", default-features = false }

[lints]
workspace = true
