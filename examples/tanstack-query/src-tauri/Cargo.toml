[package]
name = "tauri-specta-example-tanstack-query"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_specta_example_tanstack_query_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = ["default"] }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { path = "../../../", features = ["derive", "typescript"] }
tauri-specta-query = { path = "../../../crates/tauri-specta-query" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
